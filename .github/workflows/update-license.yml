name: Update license year
on:
  schedule:
    - cron: '0 3 1 1 *'
  workflow_dispatch:
jobs:
  update-year:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update license year
        run: python scripts/update_license_year.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE.md
          git diff --staged --quiet || git commit -m "chore: update license year to $(date +%Y)"
          git push
