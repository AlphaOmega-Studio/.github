name: Update license year
on:
  schedule:
    - cron: '0 3 1 1 *'
  workflow_dispatch:
jobs:
  update-license-year:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update license year
        uses: FantasticFiasco/action-update-license-year@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: 'LICENSE.md'
          transform: '(?<from>\d{4})'
