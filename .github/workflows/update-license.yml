name: Update license year

on:
  schedule:
    - cron: '0 3 1 1 *'   # каждый год 1 января в 03:00 UTC
  workflow_dispatch:      # для ручного запуска

jobs:
  update-license-year:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # разрешение на создание коммита и PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # важно для правильной работы действия
      
      - name: Update license year
        uses: FantasticFiasco/action-update-license-year@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # обязательный параметр
          path: 'LICENSE.md'                   # путь к вашему файлу лицензии
