name: Sync License
on:
  push:
    paths: ['LICENSE.md']
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync LICENSE.md to all org repos
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          ORG="${GITHUB_REPOSITORY%/*}"
          for repo in $(gh repo list "$ORG" --limit 1000 --json name -q '.[].name'); do
            [ "$repo" = ".github" ] && continue
            if gh api "/repos/$ORG/$repo/contents/LICENSE.md" --silent 2>/dev/null; then
              sha=$(gh api "/repos/$ORG/$repo/contents/LICENSE.md" -q '.sha')
              gh api -X PUT "/repos/$ORG/$repo/contents/LICENSE.md" \
                -f message="chore: sync LICENSE.md" \
                -f content="$(base64 -w0 LICENSE.md)" \
                -f sha="$sha"
            else
              gh api -X PUT "/repos/$ORG/$repo/contents/LICENSE.md" \
                -f message="chore: add LICENSE.md" \
                -f content="$(base64 -w0 LICENSE.md)"
            fi
          done
